name: Forge workspace
on:
  push:
  pull_request:
jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node workspace/check.mjs bootstrap
      - run: node workspace/check.mjs start
      - run: node workspace/check.mjs health
      - run: node app/skeleton.mjs
